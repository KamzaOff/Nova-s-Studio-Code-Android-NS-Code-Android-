name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create build_app com.novastudio.nscode "NS Code"
          cd build_app
          cordova platform add android
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NS-Code-Android-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
